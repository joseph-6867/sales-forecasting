<!DOCTYPE html>
<html>
<head>
  <title>Signing you in...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; min-height: 100vh;
           background: #0f172a; color: #94a3b8; }
    .box { text-align: center; padding: 40px; max-width: 400px; width: 90%; }
    .spinner { width: 44px; height: 44px; border: 3px solid #1e293b;
               border-top-color: #6366f1; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 8px; }
    p  { font-size: 0.85rem; color: #64748b; }
    .error { background: #1e1b2e; border: 1px solid #7c3aed;
             border-radius: 8px; padding: 16px; margin-top: 20px;
             text-align: left; font-size: 0.8rem; word-break: break-all; }
    .error h3 { color: #f87171; margin-bottom: 8px; }
    a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="msg">Completing sign-in…</h2>
  <p id="sub">You will be redirected automatically.</p>
  <div class="error" id="errbox" style="display:none">
    <h3>⚠️ Sign-in error</h3>
    <div id="errtext"></div>
    <br><a href="https://deploy-financial66.streamlit.app/">← Back to app</a>
  </div>
</div>

<script>
(function () {
  var APP = "https://deploy-financial66.streamlit.app/";

  function showError(msg) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").textContent = "Sign-in failed";
    document.getElementById("sub").textContent = "";
    var box = document.getElementById("errbox");
    box.style.display = "block";
    document.getElementById("errtext").textContent = msg;
  }

  // ── Parse BOTH hash fragment AND query string ──────────────────
  function parseParams(str) {
    var p = {};
    if (!str || str.length < 2) return p;
    str.substring(1).split("&").forEach(function (part) {
      var idx = part.indexOf("=");
      if (idx > 0) {
        p[decodeURIComponent(part.slice(0, idx))] =
          decodeURIComponent(part.slice(idx + 1).replace(/\+/g, " "));
      }
    });
    return p;
  }

  var hashParams  = parseParams(window.location.hash);
  var queryParams = parseParams(window.location.search);

  // Merge: hash takes priority (tokens come in hash for implicit flow)
  var params = Object.assign({}, queryParams, hashParams);

  // ── Error from Supabase/Google ─────────────────────────────────
  if (params["error"]) {
    showError(params["error"] + ": " + (params["error_description"] || ""));
    return;
  }

  // ── Implicit flow: access_token in hash ────────────────────────
  if (params["access_token"]) {
    var qs = "?st_access_token=" + encodeURIComponent(params["access_token"]);
    if (params["refresh_token"]) {
      qs += "&st_refresh_token=" + encodeURIComponent(params["refresh_token"]);
    }
    document.getElementById("msg").textContent  = "Redirecting to app…";
    document.getElementById("sub").textContent  = APP + qs.substring(0, 40) + "…";
    window.location.replace(APP + qs);
    return;
  }

  // ── PKCE flow: code in query string ───────────────────────────
  if (params["code"]) {
    var qs2 = "?code=" + encodeURIComponent(params["code"]);
    document.getElementById("msg").textContent = "Redirecting to app…";
    window.location.replace(APP + qs2);
    return;
  }

  // ── Nothing useful ─────────────────────────────────────────────
  showError(
    "No token or code found in callback URL.\n\n" +
    "Hash: " + window.location.hash.substring(0, 120) + "\n" +
    "Query: " + window.location.search
  );
})();
</script>
</body>
</html>
